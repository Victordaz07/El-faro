<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07101c">
<title>Faro en la Tormenta</title>
<link rel="artifact-thumbnail" href="thumb.png">
<style>
/* ======== Tema: vidrio marino oscuro, acentos turquesa ======== */
:root{
  --ink:#050d17; --glass:rgba(10,22,36,.82); --glass2:rgba(18,36,56,.9); --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.22);
  --txt:#eef5fb; --txt2:#9fb3c6; --acc:#3fd7c4; --accD:#1b7f74; --warn:#ff6b7f; --coral:#ff9f7a; --pearl:#d6eeff;
  --t0:#ffd36b; --t1:#ff8fb0; --t2:#5fe3cf; --t3:#e7b583;
  --ff:'Nunito',system-ui,-apple-system,sans-serif; --fd:'Lilita One','Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--ink);color:var(--txt);font-family:var(--ff);font-weight:700;overflow:hidden;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;color:inherit}
#app{position:relative;height:100dvh;max-width:520px;margin:0 auto;overflow:hidden;background:var(--ink)}
#stage{position:absolute;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 8px 24px rgba(0,0,0,.35)}

/* ---- HUD superior ---- */
#hud{position:absolute;left:0;right:0;top:0;z-index:3;padding:calc(6px + env(safe-area-inset-top)) 8px 0;pointer-events:none;
  background:linear-gradient(180deg,rgba(3,8,14,.75),rgba(3,8,14,0))}
#hud>*{pointer-events:auto}
.hrow{display:flex;align-items:center;gap:5px}
#wave{flex:1;min-width:0;font-family:var(--fd);font-size:17px;letter-spacing:.03em;position:relative;padding-bottom:4px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#wave small{display:block;font-family:var(--ff);font-size:10px;font-weight:800;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:none}
#wprog{position:absolute;left:0;bottom:0;height:2px;width:0;border-radius:2px;background:var(--acc);transition:width .2s}
.chip{display:flex;align-items:center;gap:4px;height:28px;padding:0 9px 0 4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-family:var(--fd);font-size:14px;white-space:nowrap}
.chip i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px}
.chip.p i{background:radial-gradient(circle at 35% 30%,#fff,#cde9ff 45%,#7fb2d6)}
.chip.c i{background:radial-gradient(circle at 35% 30%,#ffd7c4,#ff8f6a 55%,#c2553a);color:#fff}
.ibtn{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--txt);font-family:var(--fd);font-size:13px}
.ibtn:active{transform:scale(.94)}
#hpwrap{margin-top:5px;position:relative}
#hpbar{height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}
#hpfill{height:100%;width:100%;background:var(--warn);transition:width .12s}
#hpfill.mid{background:#ffbf5f}#hpfill.ok{background:#4fd99a}
#shfill{position:absolute;left:0;top:0;height:3px;width:0;background:#8fd8ff}
#hptxt{display:flex;justify-content:space-between;margin-top:2px;font-size:10px;font-weight:800;color:var(--txt2);text-shadow:0 1px 2px #000}

/* ---- Avisos en el mar ---- */
#banner{position:absolute;top:22%;left:0;right:0;text-align:center;font-family:var(--fd);font-size:32px;letter-spacing:.05em;opacity:0;pointer-events:none;
  text-shadow:0 2px 12px rgba(0,0,0,.8);transition:opacity .35s,transform .35s;transform:scale(.9);z-index:2}
#banner.on{opacity:1;transform:scale(1)}
#banner small{display:block;font-family:var(--ff);font-size:13px;font-weight:900;letter-spacing:.16em;color:var(--txt2)}
#boss{position:absolute;top:calc(74px + env(safe-area-inset-top));left:12px;right:12px;display:none;z-index:2}
#bossname{font-family:var(--fd);font-size:12px;letter-spacing:.06em;color:#ffc6dc;text-shadow:0 1px 3px #000}
#boss>div{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:3px}
#bossfill{height:100%;width:100%;background:linear-gradient(90deg,#b45cff,#ff5ca8);transition:width .15s}
#mod{position:absolute;left:50%;transform:translateX(-50%);top:calc(74px + env(safe-area-inset-top));padding:4px 11px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,107,127,.5);color:#ffd2da;font-family:var(--fd);font-size:11.5px;letter-spacing:.03em;white-space:nowrap;display:none;z-index:2}
#mod.good{border-color:rgba(63,215,196,.6);color:#d3fff8}
#mod i{font-style:normal;font-family:var(--ff);font-weight:800;color:var(--txt2)}
#boss.on~#mod{top:calc(104px + env(safe-area-inset-top))}
#frostw{position:absolute;right:10px;top:calc(74px + env(safe-area-inset-top));padding:4px 10px;border-radius:999px;background:var(--glass);border:1px solid #bfe8ff;color:#e6f7ff;font-family:var(--fd);font-size:11.5px;display:none;z-index:2}
#bossart{position:absolute;left:50%;top:15%;width:min(46%,200px);aspect-ratio:1;transform:translateX(-50%) scale(.85);border-radius:50%;overflow:hidden;opacity:0;z-index:5;pointer-events:none;
  box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 40px rgba(120,170,255,.45);transition:opacity .45s,transform .6s cubic-bezier(.2,.9,.3,1.3)}
#bossart.on{opacity:1;transform:translateX(-50%) scale(1)}
#bossart img{width:100%;height:100%;object-fit:cover;display:block}
#stage.cine.art #banner{top:calc(15% + min(46vw,200px) + 16px)}
#stage::before,#stage::after{content:'';position:absolute;left:0;right:0;height:0;background:#000;z-index:4;transition:height .45s ease;pointer-events:none}
#stage::before{top:0}#stage::after{bottom:0}
#stage.cine::before,#stage.cine::after{height:11%}
#stage.cine~#dock,#stage.cine~#hud{opacity:0;pointer-events:none;transition:opacity .3s}
#stage.cine #banner{z-index:5}

/* ---- Barra inferior compacta ---- */
#dock{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 6px calc(6px + env(safe-area-inset-bottom));pointer-events:none}
#dock>*{pointer-events:auto}
#floaters{position:relative;height:0;pointer-events:none}
#floaters>*{pointer-events:auto}
#aim{position:absolute;left:2px;bottom:8px;padding:5px 10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--glass);font-family:var(--fd);font-size:12px;letter-spacing:.02em}
#aim b{display:block;font-family:var(--ff);font-weight:900;font-size:8.5px;letter-spacing:.12em;color:var(--txt2)}
#aim:active{transform:scale(.95)}
#taps{position:absolute;left:6px;bottom:52px;display:flex;gap:4px;pointer-events:none}
#taps i{width:9px;height:9px;border-radius:50%;background:rgba(230,251,255,.92);box-shadow:0 0 6px rgba(63,215,196,.7);transition:opacity .15s,transform .15s}
#taps i.off{opacity:.22;transform:scale(.7);box-shadow:none}
#flash{position:absolute;right:2px;bottom:6px;width:60px;height:60px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;
  background:conic-gradient(var(--acc) calc(var(--p,1)*360deg),rgba(255,255,255,.12) 0);box-shadow:0 6px 18px rgba(0,0,0,.45)}
#flash::before{content:'';position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#163049,#0a1626)}
#flash span{position:relative;font-size:22px;line-height:1;filter:drop-shadow(0 0 6px rgba(63,215,196,.7))}
#flash small{position:absolute;bottom:9px;left:0;right:0;font-family:var(--fd);font-size:9px;letter-spacing:.03em;color:var(--txt2)}
#flash:not(.cd){box-shadow:0 0 0 2px rgba(63,215,196,.5),0 0 22px rgba(63,215,196,.45)}
#flash:active{transform:scale(.94)}
#bar{display:flex;gap:6px;align-items:stretch;padding:5px;border-radius:16px}
#tabs{display:grid;grid-template-columns:34px 34px;grid-template-rows:34px 34px;gap:4px;flex:none}
.tab{--c:#fff;position:relative;display:grid;place-items:center;padding:0;border-radius:10px;border:1px solid transparent;background:rgba(255,255,255,.05);color:var(--txt2)}
.tab:nth-child(1){--c:var(--t0)}.tab:nth-child(2){--c:var(--t1)}.tab:nth-child(3){--c:var(--t2)}.tab:nth-child(4){--c:var(--t3)}
.tab svg{width:19px;height:19px;color:var(--c)}
.tab>span:not(.dot){display:none}
.tab.on{background:rgba(255,255,255,.14);border-color:color-mix(in srgb,var(--c) 60%,transparent)}
#dock.closed .tab.on{background:rgba(255,255,255,.05);border-color:transparent}
.tab .dot{position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 6px var(--acc);visibility:hidden}
.tab .dot.on{visibility:visible}
#sheet{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#sheet::-webkit-scrollbar{display:none}
#dock.closed #sheet{display:none}
#dock.closed #bar{display:inline-flex}
#grid{display:flex;gap:5px;height:72px}
#hint{position:absolute;left:8px;right:8px;bottom:calc(100% + 76px);text-align:center;font-size:11.5px;font-weight:800;color:var(--txt);opacity:0;transition:opacity .25s;pointer-events:none;text-shadow:0 1px 4px #000}
#hint.show{opacity:1}
#hint b{font-family:var(--fd);font-weight:400}
.up{--c:#fff;flex:none;width:102px;height:72px;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:space-between;text-align:left;padding:6px 7px;border-radius:11px;
  border:1px solid var(--line);background:rgba(255,255,255,.06);touch-action:pan-x;position:relative}
.up.t0{--c:var(--t0)}.up.t1{--c:var(--t1)}.up.t2{--c:var(--t2)}.up.t3{--c:var(--t3)}
.up:active{transform:scale(.96)}
.up .top{display:flex;align-items:center;gap:5px;min-width:0}
.up .ic{position:relative;flex:none;width:18px;height:18px;display:grid;place-items:center;color:var(--c)}
.up .ic svg{width:17px;height:17px}
.up .lv{position:absolute;right:-6px;bottom:-5px;min-width:13px;height:13px;padding:0 3px;border-radius:7px;background:#0a1626;border:1px solid var(--c);color:#fff;font-style:normal;font-family:var(--ff);font-weight:900;font-size:8px;line-height:11px;text-align:center}
.up .lv:empty{display:none}
.up .n{font-family:var(--fd);font-size:11px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.up .v{font-size:11.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.up .v i{font-style:normal;color:var(--txt2);font-size:10px;font-weight:800}
.up .k{font-family:var(--fd);font-size:12px;color:var(--txt2);display:flex;align-items:center;gap:4px}
.up .k::before{content:'';width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cde9ff 45%,#7fb2d6)}
.up.ready{border-color:rgba(63,215,196,.55);background:rgba(63,215,196,.1)}
.up.ready .k{color:var(--acc)}
.up.off{opacity:.55}

/* ---- Pantallas ---- */
.ov{position:absolute;inset:0;background:rgba(4,10,18,.94);display:none;flex-direction:column;align-items:center;justify-content:flex-start;gap:11px;padding:24px 18px;text-align:center;z-index:6;overflow-y:auto}
.ov.on{display:flex}
.ov>:first-child{margin-top:auto}.ov>:last-child{margin-bottom:auto}
.ov h1{margin:0;font-family:var(--fd);font-weight:400;font-size:42px;letter-spacing:.03em;line-height:.98;text-shadow:0 3px 18px rgba(0,0,0,.7)}
.ov h1 em{font-style:normal;color:#bfeee6;display:block;font-size:50px}
.ov h2{margin:0;font-family:var(--fd);font-weight:400;font-size:26px;letter-spacing:.03em}
.ov p{margin:0;color:var(--txt2);font-size:14px;max-width:330px;line-height:1.45}
.ov p b{color:var(--txt)}
.big{width:100%;max-width:310px;padding:14px 10px;border-radius:14px;border:0;font-family:var(--fd);font-weight:400;font-size:19px;letter-spacing:.04em;color:#04221e;position:relative;background:var(--acc);box-shadow:0 6px 18px rgba(63,215,196,.25)}
.big:active{transform:scale(.97)}
.big.sec{color:var(--txt);font-size:14.5px;background:var(--glass2);border:1px solid var(--line2);box-shadow:none}
.big.gold{color:var(--txt);background:linear-gradient(180deg,#24456a,#173250);border:1px solid rgba(143,216,255,.45);box-shadow:none}
.big.gold small{display:block;font-family:var(--ff);font-size:11.5px;font-weight:800;color:var(--txt2);letter-spacing:0}
.big.gold:disabled{opacity:.5}
.row3,.row2{display:flex;gap:8px;width:100%;max-width:310px}
.row3 .big,.row2 .big{padding:11px 4px;font-size:13.5px}
.badge{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#ff4d6d;color:#fff;font-family:var(--ff);font-weight:900;font-size:11px;line-height:20px;display:none}
.badge.on{display:block}
.card{width:100%;max-width:350px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;border-radius:13px;text-align:left;background:var(--glass2);border:1px solid var(--line)}
.card.sel{border-color:var(--acc)}
.card.lock{opacity:.5}
.card b{display:block;font-family:var(--fd);font-weight:400;font-size:15px;letter-spacing:.01em}
.card span{font-size:12px;color:var(--txt2)}
.card button{padding:9px 12px;border-radius:10px;border:0;font-family:var(--fd);font-size:14px;min-width:84px;white-space:nowrap;color:#04221e;background:var(--acc)}
.card button.g{background:#8fd8ff;color:#06203a}
.card button:active{transform:scale(.96)}
.card button:disabled{opacity:.35}
.card.big1{border-color:rgba(143,216,255,.5)}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden}
.prog div{height:100%;background:var(--acc)}
.list{display:flex;flex-direction:column;gap:8px;width:100%;align-items:center}
.tiny{font-size:12px;opacity:.7}
#mute,#mus,#langbtn{position:absolute;top:calc(12px + env(safe-area-inset-top));width:42px;height:42px;padding:0;font-size:17px;border-radius:12px}
#mute{right:12px}#mus{right:60px}#langbtn{right:108px;font-family:var(--fd);font-size:14px;letter-spacing:.5px}
#menu>#mus,#menu>#mute,#menu>#langbtn{margin:0}
#menu{background:var(--ink);isolation:isolate;justify-content:flex-end;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
#menu>:first-child{margin-top:0}#menu>:last-child{margin-bottom:0}
#menu::before{content:'';position:absolute;inset:-4%;z-index:-2;background:var(--art,none) center 16%/cover no-repeat;animation:kb 26s ease-in-out infinite alternate}
#menu::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(4,10,18,0) 0%,rgba(4,10,18,.05) 36%,rgba(4,10,18,.82) 60%,rgba(4,10,18,.97) 100%)}
@keyframes kb{from{transform:scale(1) translateY(0)}to{transform:scale(1.07) translateY(-1.5%)}}
.blist{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px}
.bcard{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:15px;border:1px solid rgba(180,150,255,.35);background:linear-gradient(180deg,rgba(45,37,96,.9),rgba(21,18,47,.95));animation:pop .35s both}
.bcard:active{transform:scale(.98)}
.bcard:nth-child(2){animation-delay:.07s}.bcard:nth-child(3){animation-delay:.14s}.bcard:nth-child(4){animation-delay:.21s}
.bcard .ic{font-size:28px;width:44px;text-align:center}
.bcard b{display:block;font-family:var(--fd);font-weight:400;font-size:16px}.bcard span{font-size:12.5px;color:#d3cdf5;line-height:1.35}
.bcard em{font-style:normal;font-size:10px;color:#bfeee6;font-weight:900;letter-spacing:.06em}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.seg{display:flex;gap:4px;width:100%;max-width:350px;padding:4px;border-radius:12px;background:rgba(255,255,255,.06)}
.seg button{flex:1;padding:8px 0;border-radius:9px;border:0;background:transparent;color:var(--txt2);font-family:var(--fd);font-size:13px;letter-spacing:.03em}
.seg button.on{background:rgba(255,255,255,.14);color:var(--txt)}
.node{position:relative;margin-left:14px}
.node::before{content:'';position:absolute;left:-11px;top:-10px;bottom:50%;width:9px;border-left:1.5px solid var(--line2);border-bottom:1.5px solid var(--line2);border-bottom-left-radius:7px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:350px}
.stats div{background:var(--glass2);border:1px solid var(--line);border-radius:11px;padding:8px 10px;text-align:left;font-size:11px;color:var(--txt2)}
.stats b{display:block;font-family:var(--fd);font-weight:400;font-size:18px;color:var(--txt)}
.rrow{display:flex;align-items:center;gap:10px;width:100%;max-width:350px;padding:9px 12px;border-radius:11px;background:var(--glass2);border:1px solid var(--line);text-align:left;font-size:14px}
.rrow.me{border-color:var(--acc)}
.rrow .pos{width:28px;font-family:var(--fd)}.rrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rrow .sc{font-family:var(--fd);color:var(--acc)}
.namebox{display:flex;gap:6px;width:100%;max-width:350px}
.namebox input{flex:1;padding:10px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:#fff;font-family:var(--ff);font-weight:800;font-size:14px;user-select:text;-webkit-user-select:text}
.namebox button{padding:10px 14px;border-radius:11px;border:0;font-family:var(--fd);color:#04221e;background:var(--acc)}
#tip{position:absolute;z-index:8;left:12px;right:12px;display:none;padding:14px;border-radius:15px;background:#f4f8fb;color:#0b1a28;box-shadow:0 12px 40px rgba(0,0,0,.6);font-size:14px;line-height:1.4}
#tip.on{display:block;animation:pop .3s both}
#tip b{display:block;font-family:var(--fd);font-weight:400;font-size:17px;margin-bottom:4px}
#tip button{margin-top:10px;padding:9px 18px;border-radius:10px;border:0;background:#0b1a28;color:#fff;font-family:var(--fd);font-size:14px}
#tip::after{content:'';position:absolute;left:var(--ax,50%);width:16px;height:16px;background:#f4f8fb;transform:translateX(-50%) rotate(45deg)}
#tip.down::after{bottom:-7px}#tip.up::after{top:-7px}
#toasts{position:absolute;top:calc(74px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:9;pointer-events:none}
.toast{padding:9px 15px;border-radius:13px;background:var(--glass2);border:1px solid rgba(63,215,196,.5);color:var(--txt);font-family:var(--fd);font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.5);animation:pop .3s both}
.toast small{display:block;font-family:var(--ff);font-weight:800;color:var(--txt2);font-size:11px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="boss"><span id="bossname"></span><div><div id="bossfill"></div></div></div>
    <div id="mod"></div>
    <div id="frostw">❄ ESCARCHA</div>
    <div id="bossart"><img alt=""></div>
    <div id="banner"></div>
  </div>
  <div id="hud">
    <div class="hrow">
      <div id="wave">OLEADA 1<small id="best">Récord: 0</small><span id="wprog"></span></div>
      <div class="chip p"><i></i><b id="pearls">0</b></div>
      <div class="chip c"><i>◆</i><b id="coral">0</b></div>
      <button class="ibtn" id="spd">×1</button>
      <button class="ibtn" id="pause">II</button>
    </div>
    <div id="hpwrap">
      <div id="hpbar"><div id="hpfill" class="ok"></div><div id="shfill"></div></div>
      <div id="hptxt"><span id="hpt">Faro 100 / 100</span><span id="sht"></span></div>
    </div>
  </div>
  <div id="dock">
    <div id="floaters">
      <div id="taps"></div>
      <button id="aim"><b>OBJETIVO</b><span>CERCANO</span></button>
      <button id="flash"><span>⚡</span><small>DESTELLO</small></button>
    </div>
    <div id="hint"></div>
    <div id="bar" class="panel">
      <div id="tabs"></div>
      <div id="sheet"><div id="grid"></div></div>
    </div>
  </div>

  <div class="ov on" id="menu">
    <button class="big sec" id="mus">♪</button>
    <button class="big sec" id="mute">🔊</button>
    <button class="big sec" id="langbtn" aria-label="Idioma / Language">ES</button>
    <h1>FARO EN LA<br><em>TORMENTA</em></h1>
    <p id="menuinfo"></p>
    <button class="big" id="play">JUGAR</button>
    <button class="big gold" id="daily">DESAFÍO DIARIO<small id="dailyinfo"></small></button>
    <div class="row3">
      <button class="big sec" id="mapbtn">MAPA</button>
      <button class="big sec" id="shopbtn">INVESTIGAR</button>
      <button class="big sec" id="misbtn">MISIONES<span class="badge" id="misbadge"></span></button>
    </div>
    <div class="row2">
      <button class="big sec" id="achbtn">LOGROS</button>
      <button class="big sec" id="rankbtn">RANKING</button>
    </div>
  </div>
  <div class="ov" id="over">
    <h2 id="overtitle">EL FARO SE APAGÓ</h2>
    <p id="overinfo"></p>
    <button class="big" id="again">OTRA VEZ</button>
    <div class="row3">
      <button class="big sec" id="overshop">INVESTIGAR</button>
      <button class="big sec" id="overmis">MISIONES<span class="badge" id="misbadge2"></span></button>
      <button class="big sec" id="tomenu">MENÚ</button>
    </div>
  </div>
  <div class="ov" id="pauseov">
    <h2>PAUSA</h2>
    <p id="pauseinfo"></p>
    <button class="big" id="resume">CONTINUAR</button>
    <div class="row2">
      <button class="big sec" id="pmute">SONIDO</button>
      <button class="big sec" id="pmus">MÚSICA</button>
    </div>
    <button class="big sec" id="quit">TERMINAR PARTIDA</button>
  </div>
  <div class="ov" id="cards">
    <h2>ELIGE UNA BENDICIÓN</h2>
    <p>Dura toda la partida.</p>
    <div class="blist" id="cardlist"></div>
    <button class="big sec" id="reroll">RE-TIRAR</button>
  </div>
  <div class="ov" id="shop">
    <h2>INVESTIGACIÓN</h2>
    <p id="shopcoral"></p>
    <div class="seg" id="rtabs"></div>
    <div class="list" id="shoplist"></div>
    <button class="big sec back">VOLVER</button>
  </div>
  <div class="ov" id="map">
    <h2>MAPA DEL MAR</h2>
    <p>Llega a la oleada 15 en una zona para abrir la siguiente.</p>
    <div class="list" id="maplist"></div>
    <button class="big sec back">VOLVER</button>
  </div>
  <div class="ov" id="missions">
    <h2>MISIONES DIARIAS</h2>
    <p id="misinfo"></p>
    <div class="list" id="mislist"></div>
    <button class="big sec back">VOLVER</button>
  </div>
  <div class="ov" id="achs">
    <h2>LOGROS</h2>
    <div class="stats" id="statgrid"></div>
    <div class="list" id="achlist"></div>
    <button class="big sec back">VOLVER</button>
  </div>
  <div class="ov" id="rank">
    <h2>RANKING</h2>
    <div class="seg" id="ranktabs"><button class="on" data-k="best">RÉCORD</button><button data-k="daily">DESAFÍO DE HOY</button></div>
    <p class="tiny" id="rankstatus">Cargando…</p>
    <div class="namebox" id="namebox"><input id="nameinput" maxlength="16" placeholder="Tu nombre de farero"><button id="namesave">GUARDAR</button></div>
    <div class="list" id="ranklist"></div>
    <button class="big sec back">VOLVER</button>
  </div>
  <div id="tip"><b id="tiptitle"></b><span id="tiptext"></span><br><button id="tipok">ENTENDIDO</button></div>
  <div id="toasts"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
